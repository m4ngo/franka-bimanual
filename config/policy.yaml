# Normalization contract shared by sysid, residual_wrapper, and the trained
# policies. Changing anything here invalidates previously trained checkpoints.

version: 2

residual:
  pos_scale_m: 0.05        # metres per normalised unit
  rot_scale_rad: 0.5       # radians per normalised unit
  chunk_exec: 5            # steps executed per inference call
  horizon: 10              # base-chunk steps forwarded to the residual policy
  gains_mag: 0.5
  residual_mag: 0.2
  residual_trans_mag: 0.2
  residual_rot_mag: 0.2
  res_pos_gain: 1.0
  res_rot_gain: 1.0

gripper:
  # robosuite gripper_qpos = [width/2, -width/2]; Panda finger range (m).
  panda_finger_max_m: 0.04

sysid:
  # Action kp/kd channels in [-1, 1]; 0.0 -> kp_gain = 1.0.
  default_kp: 0.0
  default_kd: 0.0
  camera_read_timeout_ms: 50.0

# Hardware rollout of the two comparison baselines (baselines/ROLLOUT.md).
# The policy itself runs in its own conda env behind ZMQ; these are the knobs
# the workstation-side client owns.
baselines:
  zmq:
    sail_port: 5556
    bspline_port: 5555        # upstream policy_server_bspline.py's own default
    recv_timeout_ms: 15000

  exec:
    # Observation/inference rate. null -> control_fps(). Goals are pushed faster
    # than this (fast_fps/slow_fps); the NUC torque law runs at 500 Hz either way.
    obs_fps: null
    fast_fps: 100
    slow_fps: 20
    # Goal-vs-measured divergence that ABORTS the episode. NOT a clamp: EE_POS
    # has no delta envelope and adding one here would be the third limit layer
    # CLAUDE.md forbids. A sped-up plan leads the arm on purpose; this only says
    # when it has stopped being a rollout and started being a drag.
    max_lead_m: 0.15
    max_lead_rad: 0.5

  sail:
    # Upstream's kwargs dict literal at the bottom of
    # run_trained_agent_receding_horizon.py, which carries a "move these
    # somewhere else" TODO. This is somewhere else.
    execute_n_actions: 8
    # Rows of the PREVIOUS plan executed while the new one is inferred. Upstream
    # runs in sim, where inference takes no sim time, so this fixed count IS its
    # latency model. Here inference takes real time, and the old plan keeps
    # going for as long as it does: at least this many rows, more if inference
    # is slower than that, until the old chunk runs out. The new chunk is then
    # entered at the row matching the rows that went out since its observation
    # -- its row 0 is that observation's own pose (the targets are the reached
    # poses), so entering earlier commands the arm back to where it was seen.
    inf_delay: 4
    slowdown_window_size: 6
    # EAG tracking-error bounds: guidance is dropped for an inference when the
    # arm is further than this from the plan. These are upstream's values, which
    # go with its kp 600 controller (lag ~1 cm, ~1.5 deg). At kp 150 the arm's
    # steady lag on a 20 Hz plan is 21 mm / 3 deg median, so they drop guidance
    # on 3 of 4 inferences; osc_kp below is what keeps the arm inside them.
    pos_teb: 0.02             # m, inf-norm
    ori_teb: 0.05             # rad
    # OSC stiffness the rollout runs under. Upstream evaluates under
    # robosuite_configs/osc_pose_SAIL.json -- kp 600, damping ratio 1 -- and its
    # reached-pose targets and pos_teb assume the arm gets there: at the law's
    # default 150 the arm trails a 20 Hz plan by ~2 cm (kd/kp = 0.16 s at
    # 0.12 m/s), over pos_teb, so guidance is dropped on nearly every inference.
    # null = torque.osc.default_kp. Sent on the kp action channel through the
    # log-base remap, so kp_limits still bind on the arm.
    osc_kp: 300
    # Damping ratio on the arm, on the kd channel by the same remap. null =
    # torque.osc.default_damping_ratio (1.0). 0.5 matches the sim default below.
    osc_damping_ratio: 0.5
    # The sim rollout's OSC gains (baselines/libero_bridge/rollout.py), merged
    # over robosuite's osc_pose.json; null keeps the stock value. LIBERO's 5 cm
    # per-step limit is never changed. SAIL trains on the poses the arm reached
    # and swaps the teleop controller for a stiff one to play them faster than
    # recorded (SAIL paper Sec. 4.2): twice the stock kp at half the damping.
    # SAIL is also evaluated at kp 1000/2000/3000 with --osc-kp and
    # --osc-damping-ratio; see LIBERO_SIM.md, "SAIL's controller".
    sim_osc:
      kp: 300
      damping_ratio: 0.5

  bspline:
    # Fallback only: the server reports the checkpoint's own n_obs_steps and
    # the client uses that; this is what an older server without it gets.
    n_obs_steps: 2
    # Hardware only. Upstream defaults this to 20, calibrated for their 10 Hz
    # data / 200 Hz control split. Here observations arrive at obs_fps and 20
    # would buffer 40 of them before the first plan. The sim rollout derives its
    # own (fast_fps / 20) so the policy's frames stay one demo frame apart.
    obs_stride: 1
    # Index-space knots -> seconds, i.e. the rate the demonstrations were
    # RECORDED at: t advances at this many knot-index units per second, and the
    # knots count frames. null -> control_fps(). Upstream's 10.0 against 20 Hz
    # data advances t at half the needed rate, so every plan plays at 0.5x --
    # twice the wall clock, and it reads as a sluggish controller rather than as
    # a misconfiguration. Measured in scripts/check_baseline_rollout_offline.py.
    origin_time_scale: null
    speed_up_times: 1.0
    # Wall-clock seconds of plan left when the next spline is requested.
    # Upstream's documented rollout command (inference/README.md) uses 0.1;
    # 0.06 is only its argparse default. Checked once per observation (50 ms),
    # so 0.06 let a request go out with as little as 10 ms left.
    predict_before_end: 0.1
    time_align_error_threshold: 0.1
    time_align_larger_t: 0.2
    gripper_slowdown_enabled: false
    gripper_slowdown_threshold: 0.08
    gripper_slowdown_steps: 7
    # The sim rollout's OSC, as baselines.sail.sim_osc. null: the stock
    # controller, because B-Spline trains on the goals that controller was
    # sent, and a stiffer one overshoots them (LIBERO_SIM.md, "SAIL's controller").
    sim_osc: null
