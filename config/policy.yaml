# Normalization contract shared by sysid, residual_wrapper, and the trained
# policies. Changing anything here invalidates previously trained checkpoints.

version: 2

residual:
  pos_scale_m: 0.05        # metres per normalised unit
  rot_scale_rad: 0.5       # radians per normalised unit
  chunk_exec: 5            # steps executed per inference call
  horizon: 10              # base-chunk steps forwarded to the residual policy
  gains_mag: 0.5
  residual_mag: 0.2
  residual_trans_mag: 0.2
  residual_rot_mag: 0.2
  res_pos_gain: 1.0
  res_rot_gain: 1.0

gripper:
  # robosuite gripper_qpos = [width/2, -width/2]; Panda finger range (m).
  panda_finger_max_m: 0.04

sysid:
  # Action kp/kd channels in [-1, 1]; 0.0 -> kp_gain = 1.0.
  default_kp: 0.0
  default_kd: 0.0
  camera_read_timeout_ms: 50.0

# Hardware rollout of the two comparison baselines (baselines/ROLLOUT.md).
# The policy itself runs in its own conda env behind ZMQ; these are the knobs
# the workstation-side client owns.
baselines:
  zmq:
    sail_port: 5556
    bspline_port: 5555        # upstream policy_server_bspline.py's own default
    recv_timeout_ms: 15000

  exec:
    # Observation/inference rate. null -> control_fps(). Goals are pushed faster
    # than this (fast_fps/slow_fps); the NUC torque law runs at 500 Hz either way.
    obs_fps: null
    fast_fps: 100
    slow_fps: 20
    # Goal-vs-measured divergence that ABORTS the episode. NOT a clamp: EE_POS
    # has no delta envelope and adding one here would be the third limit layer
    # CLAUDE.md forbids. A sped-up plan leads the arm on purpose; this only says
    # when it has stopped being a rollout and started being a drag.
    max_lead_m: 0.15
    max_lead_rad: 0.5

  sail:
    # Upstream's kwargs dict literal at the bottom of
    # run_trained_agent_receding_horizon.py, which carries a "move these
    # somewhere else" TODO. This is somewhere else.
    execute_n_actions: 8
    inf_delay: 4
    slowdown_window_size: 6
    pos_teb: 0.02             # EAG position tracking-error bound (m)
    ori_teb: 0.05             # EAG orientation tracking-error bound (rad)

  bspline:
    n_obs_steps: 2
    # Upstream defaults this to 20, calibrated for their 10 Hz data / 200 Hz
    # control split. Here observations arrive at obs_fps and 20 would buffer 40
    # of them before the first plan.
    obs_stride: 1
    # Index-space knots -> seconds, i.e. the rate the demonstrations were
    # RECORDED at: t advances at this many knot-index units per second, and the
    # knots count frames. null -> control_fps(). Upstream's 10.0 against 20 Hz
    # data advances t at half the needed rate, so every plan plays at 0.5x --
    # twice the wall clock, and it reads as a sluggish controller rather than as
    # a misconfiguration. Measured in scripts/check_baseline_rollout_offline.py.
    origin_time_scale: null
    speed_up_times: 1.0
    predict_before_end: 0.06
    time_align_error_threshold: 0.1
    time_align_larger_t: 0.2
    gripper_slowdown_enabled: false
    gripper_slowdown_threshold: 0.08
    gripper_slowdown_steps: 7
