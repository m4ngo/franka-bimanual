# Normalization contract shared by sysid, residual_wrapper, and the trained
# policies. Changing anything here invalidates previously trained checkpoints.

version: 2

residual:
  pos_scale_m: 0.05        # metres per normalised unit
  rot_scale_rad: 0.5       # radians per normalised unit
  chunk_exec: 5            # steps executed per inference call
  horizon: 10              # base-chunk steps forwarded to the residual policy
  gains_mag: 0.5
  residual_mag: 0.2
  residual_trans_mag: 0.2
  residual_rot_mag: 0.2
  res_pos_gain: 1.0
  res_rot_gain: 1.0

gripper:
  # robosuite gripper_qpos = [width/2, -width/2]; Panda finger range (m).
  panda_finger_max_m: 0.04

sysid:
  # Action kp/kd channels in [-1, 1]; 0.0 -> kp_gain = 1.0.
  default_kp: 0.0
  default_kd: 0.0
  camera_read_timeout_ms: 50.0

# Hardware rollout of the two comparison baselines (baselines/ROLLOUT.md).
# The policy itself runs in its own conda env behind ZMQ; these are the knobs
# the workstation-side client owns.
baselines:
  zmq:
    sail_port: 5556
    bspline_port: 5555        # upstream policy_server_bspline.py's own default
    recv_timeout_ms: 15000

  exec:
    # Upstream SAIL's fast_control_freq / slow_control_freq (Hz). The sim rollout
    # runs at these; the real SAIL rollout takes fast = --speed x control_fps()
    # and keeps slow_fps, upstream's 1x.
    fast_fps: 100
    slow_fps: 20
    # Real rollouts' dataset frame rate. null -> control_fps(), the demonstrations' rate.
    record_fps: null
    # How far the home may put the EE from where the training demonstrations
    # started before a real rollout refuses it (rollout_common.resolve_home).
    home_tolerance_m: 0.02
    home_tolerance_rad: 0.1
    # The rollout process's GIL hand-off. At CPython's 5 ms default a busy camera
    # or inference thread can hold the goal loop past a whole 200 Hz period.
    gil_switch_interval_s: 5.0e-4

  sail:
    # Upstream's kwargs literal (run_trained_agent_receding_horizon.py).
    # Rows of a plan executed, from the row it took over at, before the next
    # observation and inference.
    execute_n_actions: 8
    # Upstream's simulated inference delay, in rows. On the arm the delay is real
    # and measured; this is the latest row a request may wait for (H - inf_delay).
    inf_delay: 4
    slowdown_window_size: 6
    # EAG tracking-error bounds: guidance is dropped for an inference when the
    # arm, at the observation, is further than this from where the plan wanted it.
    pos_teb: 0.02             # m, inf-norm
    ori_teb: 0.05             # rad
    # Rate the splined plan is streamed to the arm at; the paper's hardware
    # executor interpolates and schedules each chunk at 100 Hz (App. D.1).
    goal_hz: 100
    # The spline fitted over each plan (sail_bridge/schedule.py): one interior knot
    # every this many rows. The rows are reached poses, which carry the
    # recording's frame-to-frame jitter; 1 would interpolate it into the velocity
    # target. The paper fits a spline and does not say how smooth.
    spline_knot_rows: 4
    # OSC stiffness on the arm, as a multiple of torque.osc.default_kp: kp 300,
    # the paper's hardware stiffness (App. J, Table J.5), twice the stiffness the
    # demonstrations were collected under.
    osc_kp_scale: 2.0
    # Damping ratio on the arm. The paper's hardware kv 34.6 is ratio 1.0; 0.5 is
    # the sim rollout's (sim_osc below), chosen here as well.
    osc_damping_ratio: 0.5
    # The sim rollout's OSC gains (baselines/libero_bridge/rollout.py), merged
    # over robosuite's osc_pose.json; null keeps the stock value. LIBERO's 5 cm
    # per-step limit is never changed. SAIL is also evaluated at kp
    # 1000/2000/3000 with --osc-kp and --osc-damping-ratio; see LIBERO_SIM.md,
    # "SAIL's controller".
    sim_osc:
      kp: 300
      damping_ratio: 0.5

  bspline:
    # Fallback only: the server reports the checkpoint's own n_obs_steps.
    n_obs_steps: 2
    # Real rollout goal rate: upstream's --control-freq (its README runs 200).
    control_freq: 200
    # Knot-index units per second, i.e. the rate the demonstrations were
    # RECORDED at. null -> control_fps(). Upstream's 10.0 is its own 10 Hz data;
    # against 20 Hz data it would play every plan at 0.5x.
    origin_time_scale: null
    speed_up_times: 1.0
    # Upstream's README rollout command: --predict-before-end 0.1.
    predict_before_end: 0.1
    time_align_error_threshold: 0.1
    # How far into a new spline the alignment search may look, as a fraction of
    # its length. 0.2 is upstream's code default; 0.5 is the paper appendix's
    # half segment. Shared with the sim rollout.
    time_align_larger_t: 0.5
    # Lead each sampled goal by (kd/kp)*(1 - 1/speed_up_times) s along the plan, so
    # a sped-up plan is trailed by the distance it was at 1x -- what upstream's
    # set_ik_dt_scale(speed_up_times) servo speed-up does -- at stock stiffness:
    # 82 ms at 2x, 109 ms at 3x. Both the real and the sim rollout; false sends
    # the plan as sampled.
    goal_lead: true
    # Real rollout. Upstream enters a new plan the moment it lands; when that is
    # before the plan's first knot, its alignment has no window to search and the
    # plan starts at that knot, so the goal jumps ahead by the gap. YAM's IK servo
    # (orientation gain 1/s) glides over it; the OSC does not. true keeps the old
    # plan until that knot is due, then aligns as upstream does. Offline on
    # filter-10-6-bowl-plate at 75 ms latency, 1x: stitch jump p90 1.3 cm / 1.6 deg
    # -> 0.3 cm / 0.6 deg. false is upstream exactly.
    defer_stitch: true
    # Real rollout, not upstream's: when the plan's gripper command closes (crosses
    # grasp_threshold downward; the demonstrations command 1 open, 0 shut) the arm
    # holds the pose it is at for grasp_hold_s with the gripper commanded shut,
    # whether or not the fingers have finished, the plan's clock stopped; then
    # resumes the plan where it left it. 0 disables.
    grasp_hold_s: 0.4
    grasp_threshold: 0.5
    # Releasing never pauses: after a grasp, a new one can only trigger once the
    # command has opened past this again, so a release that dips back under
    # grasp_threshold (a replan, spline overshoot) is not taken for a grasp.
    grasp_rearm: 0.9
    gripper_slowdown_enabled: false
    gripper_slowdown_threshold: 0.08
    gripper_slowdown_steps: 7
    # The sim rollout's OSC, as baselines.sail.sim_osc. null: the stock
    # controller, because B-Spline trains on the goals that controller was
    # sent, and a stiffer one overshoots them (LIBERO_SIM.md, "SAIL's controller").
    sim_osc: null
