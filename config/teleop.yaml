# Leader-device hardware parameters. Ports and scales here are authoritative;
# scripts/*.sh no longer pass them on the CLI.

version: 2

gello:
  baudrate: 57600
  # Reference joint angles (rad) at the calibration home pose, one per motor.
  calibration_position: [0, 0, 0, -1.57, 0, 1.57, 0, 0]
  joint_signs: [1, 1, 1, -1, 1, -1, 1, -1]
  gripper_travel_counts: 575
  smoothing: 0.99          # EMA alpha; 1.0 = no smoothing
  use_async: true
  use_noise: false
  devices:
    left: {port: /dev/ttyUSB1}
    right: {port: /dev/ttyUSB0}

spacemouse:
  # These are robosuite osc_pose.json's output_max, so full deflection is
  # exactly a normalized +/-1 policy action -- teleop and policy drive the
  # controller through identical units. clip_delta enforces the same bound
  # downstream, so raising them past 0.05/0.5 only saturates earlier.
  translation_scale: 0.05   # metres per tick at full deflection
  rotation_scale: 0.5       # radians per tick at full deflection
  # Fraction of full deflection treated as zero, with the remainder rescaled so
  # full deflection still reaches 1.0. The puck cross-talks: twisting to yaw
  # drives the linear axes to ~0.23, which is ~1.2 cm/tick of translation the
  # operator never commanded.
  deadzone: 0.08
  # Per-axis sign trims in BASE frame, applied AFTER spacemouse.py's
  # LINEAR_DEVICE_TO_BASE / ANGULAR_DEVICE_TO_BASE. The device mounting lives in
  # those matrices, not here — these only exist to flip an axis without editing
  # one. Identity for translation because the matrix already encodes this rig's
  # mounting; a -1 here on top of it swaps X and Y rather than mirroring.
  translation_signs: [1, 1, 1]
  # Yaw is inverted on this puck; the controller itself is correctly signed.
  rotation_signs: [1, 1, -1]
  noise_pos_scale: 0.05
  noise_rot_scale: 0.03
  # Seeded from the arm by seed_state(); these only matter before the first read.
  initial_pos: [0.5, 0.0, 0.5]
  initial_quat_wxyz: [1.0, 0.0, 0.0, 0.0]
  gripper_min_mm: -1.0
  gripper_max_mm: 1.0
  initial_gripper_mm: 0.9
  devices:
    left: {hidraw_path: /dev/hidraw2}
    right: {hidraw_path: /dev/hidraw3}
